# Tide VLLM Service Configuration

log:
  formatter: glog
  level: debug
  filepath: ./log
  max_age: 604800s  # 168h
  max_count: 200
  rotate_interval: 3600s
  rotate_size: 104857600
  report_caller: true
  redirect: both  # stdout: 仅控制台, file: 仅文件, both: 同时输出

web:
  bind_address:
    host: "0.0.0.0"
    port: 10002
  grpc:
    enabled: false

  # OpenTelemetry 配置（可选）
  open_telemetry:
    enabled: false


  # QPS限流配置
  qps_limit:
    http:
      default_qps: 10
      default_burst: 15
      max_concurrency: 10

# vLLM 配置
vllm:
  enabled: true

  # 是否自动启动 vLLM server（设为 true 则在服务启动时自动启动 vLLM）
  # 如果设为 false，则需要手动先启动 vLLM server
  auto_start: true

  # vLLM 服务器地址（当 auto_start=true 时，vLLM 将在此地址启动）
  host: "0.0.0.0"
  port: 8001

  # API Key（如果需要）
  api_key: ""

  # ========== 模型配置 ==========
  # served model name（客户端请求时使用的模型名称）
  model_name: "Qwen2.5-7B-Instruct"
  # 模型路径（本地路径或 HuggingFace model id）
  model_path: "/app/model"

  # ========== 生成参数 ==========
  max_tokens: 512
  temperature: 0.0
  top_p: 0.9

  # ========== 请求配置 ==========
  timeout: 120  # 请求超时（秒），视频处理需要更长时间

  # ========== vLLM Server 启动参数（仅当 auto_start=true 时有效）==========
  gpu_memory_utilization: 0.9
  tensor_parallel_size: 1
  max_num_seqs: 256
  max_num_batched_tokens: 32768
  max_model_len: 38400
  dtype: "bfloat16"
  startup_timeout: 600
  enable_prefix_caching: true
  enable_chunked_prefill: true

  # ========== 多模态处理参数（vLLM Server 启动参数）==========
  # 多模态处理器参数（视频帧采样配置）
  mm_processor_kwargs:
    fps: 0.5
    size:
      shortest_edge: 196608    # 192 * 32 * 32
      longest_edge: 524288     # 512 * 32 * 32
    do_sample_frames: true

  # 媒体IO参数（视频帧数控制，-1 表示使用所有帧）
  media_io_kwargs:
    video:
      num_frames: -1

  # ========== 视频场景审核特有配置 ==========
  # 是否返回 logprobs（用于置信度评分）
  logprobs: true
  # 返回 top-k 个 logprobs
  top_logprobs: 10
  # 随机种子
  seed: 42
  # 场景分类阈值
  scene_cls_threshold: 0.1
  # 最大并发请求数
  max_concurrent_requests: 4

  # ========== 视频解码配置 ==========
  # 视频解码方式配置，决定由谁来完成视频帧的解码
  video_decode:
    # 解码方式：vllm（默认，由 vLLM 自行解码） / decord（推荐，性能最好） / opencv / ffmpeg（基于 PyAV，支持更多格式） / qwenvl（使用 qwen-vl-utils，与 Qwen3-VL 预处理完全一致）
    method: "ffmpeg"
    # 抽帧频率（帧/秒），仅 decord / opencv / ffmpeg 模式有效
    fps: 0.5
    # 最大帧数限制，-1 表示不限制，仅 decord / opencv / ffmpeg 模式有效
    max_frames: -1
    # 输出图片格式：JPEG 或 PNG，仅 decord / opencv / ffmpeg 模式有效
    image_format: "JPEG"
    # 图片压缩质量（仅 JPEG 有效），范围 1-100，仅 decord / opencv / ffmpeg 模式有效
    image_quality: 85
    # 分辨率缩放配置（与 vLLM mm_processor_kwargs.size 对应），仅 decord / opencv / ffmpeg 模式有效
    # shortest_edge: 像素总数下限，低于此值会放大图片
    # longest_edge: 像素总数上限，超过此值会缩小图片
    size:
      shortest_edge: 196608    # 192 * 32 * 32
      longest_edge: 524288     # 512 * 32 * 32
    # 预解码帧传入 vLLM 的方式（仅预解码模式有效）：
    #   image: 以多个 image_url 方式传入（每帧作为独立图片，模型无 temporal 信息）
    #   video: 将帧重新编码为 mp4 视频后以 video_url 传入（保持 temporal position embedding，
    #          与 vLLM 自行解码一致，推理结果更准确，但有额外的编解码开销）
    #   注意：vLLM OpenAI API 不支持 qwen-vl-utils 原生的 type=video 帧列表格式，
    #         所有预解码方法（包括 qwenvl）在 video 模式下统一使用 video_url 方式
    input_mode: "image"

# 进程资源监控配置
monitor:
  # 是否启用监控插件（启用后提供 /debug/monitor/* API 端点）
  enabled: true

  # 是否在启动时自动开始持续采集（false 则只提供按需快照 API）
  auto_start: true

  # 采集间隔（秒），仅持续采集模式有效
  interval: 5

  # 是否启用 GPU 监控（需要 pynvml）
  enable_gpu: false

  # 是否监控子进程（如 vLLM server）
  include_children: true

  # 历史记录最大条数（按采集间隔计算，36000 条 × 5 秒 = 50 小时）
  history_size: 36000
